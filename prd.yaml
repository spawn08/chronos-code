meta:
  product_name: Chronos Code
  tagline: "YAML-native AI coding agent harness built on Chronos"
  repository: github.com/spawn08/chronos-code  # separate repo — see rationale below
  framework_dependency: github.com/spawn08/chronos v0.x
  binary_name: chronos-code
  target_binary_size: "<20MB stripped"
  target_token_efficiency: "40-60% fewer tokens per task vs Claude Code / Cursor / Aider"
  license: same as Chronos

# ============================================================================
# 1. EXECUTIVE SUMMARY
# ============================================================================

summary: |
  Chronos Code is an AI coding agent harness — a standalone CLI and server
  binary built on the Chronos agentic framework. It provides a YAML-first,
  configuration-driven experience for defining, composing, and running AI
  coding agents with full MCP integration, tool calling, subagent delegation,
  persistent memory, session management, guardrails, and a self-learning loop
  that distills past executions into reusable YAML agent definitions.

  Think of it as "infrastructure for building your own Cursor/Claude Code" —
  batteries-included out of the box, infinitely customizable via YAML, and
  deployable as a tiny CLI for local dev or a horizontally-scaled server for
  team/enterprise use.

# ============================================================================
# 2. COMPETITIVE LANDSCAPE & BENCHMARK
# ============================================================================

competitive_benchmark:
  overview: |
    The AI coding agent market in 2026 has 13+ serious tools. None combines
    all of: token efficiency, code graph indexing, YAML-first config,
    self-learning, and enterprise auth in a single small binary. Chronos Code
    targets the intersection of Aider's token efficiency, Augment Code's
    context engine, and Claude Code's agentic capabilities — without IDE
    lock-in or cloud dependency.

  # ── Head-to-Head Comparison ─────────────────────────────────────────

  comparison_table:
    columns:
      - "Tool"
      - "Type"
      - "Context Engineering"
      - "Token Efficiency"
      - "SWE-bench"
      - "Code Indexing"
      - "MCP"
      - "Enterprise Auth"
      - "Self-Learning"
      - "Binary/Install"

    rows:
      - tool: "Claude Code"
        type: "CLI agent"
        context: "Full file reads on demand. CLAUDE.md + .claude/ rules. 1M context window."
        tokens: "High (~4.2x Aider baseline). No compression, no graph."
        swe_bench: "80.9% (Opus 4.6) → 88.6% (Opus 4.8) → 95.0% (Fable 5)"
        indexing: "None. Runtime grep/read only."
        mcp: "Full (stdio + SSE)"
        auth: "OAuth PKCE for Pro/Max/Team/Enterprise. Bans third-party OAuth relay."
        learning: "No"
        binary: "npm install, ~50MB node_modules"

      - tool: "Cursor"
        type: "IDE (VS Code fork)"
        context: "Vector embeddings via Turbopuffer. .cursor/rules/. @codebase query."
        tokens: "Highest (~23x Aider). Massive context sends per turn."
        swe_bench: "N/A (IDE, not benchmarked on SWE-bench)"
        indexing: "Background vector embedding. Modified-file re-indexing."
        mcp: "Yes"
        auth: "Subscription ($20-40/mo). No BYO key."
        learning: "No"
        binary: "IDE download, ~500MB"

      - tool: "Aider"
        type: "CLI (Python)"
        context: "Repo-map via tree-sitter AST. Function signatures, graph-ranked. ~1K token budget."
        tokens: "Best in class (1.0x baseline). Repo-map is the key innovation."
        swe_bench: "88.0% (polyglot, gpt-5 high)"
        indexing: "On-demand tree-sitter parse. No background daemon."
        mcp: "No"
        auth: "BYO API key only. No enterprise."
        learning: "No"
        binary: "pip install, Python dependency"

      - tool: "OpenAI Codex CLI"
        type: "CLI (Rust)"
        context: "OS-level kernel sandbox scopes context naturally."
        tokens: "Low (~1.5x Aider). Sandbox limits context scope."
        swe_bench: "~72%"
        indexing: "None. Reads on demand within sandbox."
        mcp: "Yes (client + server)"
        auth: "OpenAI API key or subscription. Device flow."
        learning: "No"
        binary: "Rust binary, ~15MB"

      - tool: "Windsurf (Codeium)"
