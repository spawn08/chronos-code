  # ── Key Competitive Insights ────────────────────────────────────────

  insights:
    - insight: "Token efficiency and accuracy are inversely correlated in current tools"
      detail: |
        Claude Code has the highest accuracy (80-95% SWE-bench) but the highest
        token cost (4.2x baseline). Aider has the best efficiency (1.0x) but
        lower accuracy. NO tool achieves both. Chronos Code's code graph +
        tiered routing targets this gap: Aider-class efficiency with Claude
        Code-class accuracy.

    - insight: "Code graph indexing is the proven context engineering winner"
      detail: |
        Research (ICLR 2025, RepoGraph): repo-level code graphs boost SWE-bench
        by 32.8%. CodeGraph MCP reduces token costs by ~35% and tool calls by
        ~70%. AST-derived graphs (tree-sitter) build in seconds, outperform
        LLM-generated graphs. Augment Code's proprietary graph handles 500K
        files. This is the key architectural investment.

    - insight: "'More tokens makes agents worse' — context stuffing degrades performance"
      detail: |
        Martin Fowler (ThoughtWorks, 2026), Sequoia Capital research, and
        Augment Code's findings all agree: a weaker model with excellent context
        outperforms a stronger model with poor context. Over-stuffing the
        context window with irrelevant code hurts accuracy. Selective, graph-
        guided context loading is superior to "dump everything."

    - insight: "No tool has a self-learning loop"
      detail: |
        Zero of the 13 tools learn from past executions. Every session starts
        from scratch. Chronos Code's self-learning loop (trace → distill →
        generate YAML) is a genuine differentiator with no current competitor.

    - insight: "Enterprise auth is fragmented and restrictive"
      detail: |
        Anthropic banned third-party OAuth relay (April 2026). OpenAI and Google
        still allow it. Pi works around this with API keys for Anthropic. The
        safe approach: API key as primary, OAuth where allowed, enterprise SSO
        for server mode.

    - insight: "CLI agents are winning over IDE agents for power users"
      detail: |
        Claude Code, Aider, Codex CLI, Pi — the trend is toward standalone CLI
        agents that work with any editor. IDE lock-in (Cursor, Windsurf) limits
        adoption. CLI + optional IDE integration is the right architecture.

  # ── Chronos Code Positioning ────────────────────────────────────────

  positioning:
    tagline: "Aider's efficiency + Augment's context engine + Claude Code's agentic power — in a <20MB binary"

    unique_combination:
      - "Code graph indexing (like Augment) — but open-source and local-only"
      - "Token efficiency (like Aider) — plus tiered routing and compression"
      - "Full MCP support (like Claude Code) — YAML-configured"
      - "Self-learning loop — no competitor has this"
      - "YAML-first config (unique) — agents, skills, guardrails, security"
      - "Embedded defaults (unique) — zero-config first run"
      - "Small binary (like Codex CLI) — <20MB, Go, no runtime deps"
      - "Enterprise auth — API key + OAuth + SSO federation"
      - "Server mode (like Devin) — but self-hosted, horizontal scaling"

    target_benchmarks:
      token_efficiency: "1.0-1.5x Aider baseline (40-60% less than Claude Code)"
      accuracy: ">80% on SWE-bench Lite (Claude Code class)"
      binary_size: "<20MB stripped (Codex CLI class)"
      index_speed: "<30s full index on 50K-file project"
      startup: "<500ms to first prompt"

# ============================================================================
# 3. REPOSITORY DECISION: SEPARATE CODEBASE
# ============================================================================

repository_decision:
  recommendation: SEPARATE_REPO
  name: chronos-code
  import: "github.com/spawn08/chronos (library dependency)"

  rationale:
    - heading: Binary size control
      detail: |
        Chronos's go.mod carries k8s client-go (~20MB), aws-sdk-go-v2 (~15MB),
        mongo-driver (~8MB), wazero (~10MB), and swagger (~5MB) for storage
        adapters and sandbox backends the coding agent never uses. While Go's
        linker only includes reachable code, a separate go.mod means `go mod
        tidy` never downloads these at all. The coding agent's deps are: core
        Chronos SDK/engine packages, sqlite (modernc ~8MB), pgx (~3MB), yaml,
        tiktoken, and a terminal UI library. Target: <20MB stripped binary vs
        the current 71MB monolith.

    - heading: Product vs framework lifecycle
      detail: |
        Chronos is a framework — it ships when interfaces stabilize. Chronos
        Code is a product — it ships when a feature is ready. Decoupled repos
        mean the coding agent can cut releases weekly (bug fixes, new skills,
        prompt tuning) without touching the framework. The framework pins at a
        tested version via go.mod.

    - heading: Product-specific dependencies
      detail: |
        The coding agent will need tree-sitter bindings (AST-aware code search),
        LSP client (go-to-definition, diagnostics), diff/patch libraries, a
        terminal UI (bubbletea or similar), and potentially git2go. None of
        these belong in a general-purpose agentic framework's go.mod.

    - heading: Clean dependency graph
      detail: |
        chronos-code → chronos (one-way). No circular dependency. Chronos
        remains framework-shaped. The coding agent is the flagship consumer,
        not a special case inside the framework.

  what_stays_in_chronos:
    - "sdk/agent — builder, YAML config, BuildAgent/BuildAll"
    - "sdk/harness — DeepAgent preset, subagent service, planning tools, VFS"
    - "sdk/memory — Store, Manager, vector recall"
    - "sdk/skill — Skill, Registry, SKILL.md loader"
    - "sdk/team — multi-agent strategies"
    - "engine/* — model providers, tool registry, graph, MCP client, guardrails, hooks, streaming"
    - "storage/storage.go, storage/vector.go — interfaces"
    - "storage/adapters/sqlite, storage/adapters/postgres — production adapters"

  what_goes_in_chronos_code:
    - "cmd/chronos-code — binary entry point"
    - "internal/agent — coding-agent-specific agent definitions and prompt engineering"
    - "internal/workspace — project detection, file indexing, .gitignore awareness"
    - "internal/learning — self-learning loop (trace → distill → YAML generation)"
    - "internal/config — .chronos-code/ directory structure, settings, security policies"
    - "internal/tui — terminal UI (interactive REPL, permission prompts, streaming)"
    - "internal/server — HTTP/gRPC server for team deployment"
    - "internal/lsp — LSP client for code intelligence (optional, build-tagged)"
    - "skills/ — built-in skill YAML definitions"
    - "guardrails/ — YAML-configurable guardrail presets"
    - "agents/ — default agent YAML definitions (coder, reviewer, planner, etc.)"

# ============================================================================
# 4. GOALS & NON-GOALS
# ============================================================================

goals:
  - id: G-001
    title: YAML-native configuration
    detail: |
      All agent definitions, team compositions, tool permissions, guardrails,
      MCP server connections, skills, and security policies are expressed in
      YAML. No Go code required to define or customize agents. YAML is the
      first-class citizen — not markdown, not JSON, not code.

  - id: G-002
    title: Minimal binary size
    detail: |
      Stripped CLI binary under 20MB. Achieved by: separate go.mod (no k8s,
      aws, mongo, wazero, swagger transitive deps), careful import selection,
      and optional features behind build tags (LSP, tree-sitter).

  - id: G-003
    title: Full MCP integration
    detail: |
      First-class MCP client (already in Chronos engine/mcp) for connecting
      to external tool servers (filesystem, git, databases, APIs). Agents
      declare MCP servers in YAML; the harness auto-connects, registers tools,
      and enforces per-server permission policies.

  - id: G-004
    title: Tool calling with permission model
    detail: |
      Tools are the agent's hands. Built-in tools (file read/write/glob/grep,
      shell, semantic search) plus MCP-sourced tools plus custom YAML-defined
      tools. Three-tier permission model (allow/require_approval/deny) with
      YAML-configurable per-tool overrides and interactive user approval in
      the TUI.

  - id: G-005
    title: YAML-defined agents with subagent support
    detail: |
      Agents are defined in YAML files under .chronos-code/agents/. A parent
      agent can spawn subagents (named or dynamic) that run in isolated
      contexts, inherit the parent's model, and return only their result.
      Subagent nesting is depth-bounded. Teams of agents use the 6 existing
      Chronos strategies (sequential, parallel, router, coordinator, swarm,
      hierarchy).

  - id: G-006
    title: Small CLI, scalable server
    detail: |
      Single binary serves both modes. CLI mode: interactive REPL for local
      dev, single-user, SQLite storage. Server mode: multi-tenant HTTP/gRPC
      server, PostgreSQL storage, horizontal scaling, SSE streaming, session
      management, auth.

  - id: G-007
    title: Database-backed persistence
    detail: |
      Sessions, memory, audit logs, traces, checkpoints — all persisted via
      Chronos storage interfaces. SQLite for local (zero-config), PostgreSQL
      for server (production). No new storage adapters needed — Chronos's
      existing sqlite and postgres adapters cover all 18 Storage methods.

  - id: G-008
    title: Local memory layer
    detail: |
      The AI coding agent manages its own memory locally. Short-term (within
      session) and long-term (cross-session) memory with optional vector-based
      semantic recall. Memory is scoped per-project and per-user. The agent
      auto-extracts memories from conversations (Chronos sdk/memory/Manager).
      Memory files live in .chronos-code/memory/ as YAML — inspectable and
      editable by the user.

  - id: G-009
    title: Self-learning loop
    detail: |
      After each session, the harness runs a distillation pass: analyze the
      execution trace, extract what worked (tool sequences, prompt patterns,
      successful strategies), and generate/update YAML agent definitions,
      skills, and guardrail configs. This is NOT fine-tuning — it is
      structured knowledge extraction into YAML artifacts that improve future
      runs. The learning loop is opt-in and transparent (all generated YAML
      is human-reviewable).

  - id: G-010
    title: Skills integration
    detail: |
      Skills are reusable capability bundles (Chronos sdk/skill). The coding
      agent ships with built-in skills (code-review, refactor, test-writer,
      debug, explain, migrate) defined as YAML + markdown manifests in
      .chronos-code/skills/. Users add custom skills in the same format.
      Skills are referenced by name in agent YAML (use_skills:).

  - id: G-011
    title: Guardrails and security via config
    detail: |
      Guardrails (input/output validation) are configured in YAML — not in
      code. Ship with presets: prompt-injection detection, PII filtering,
      blocklist, max-length, cost caps, file-path allowlists. Security
      policies (which directories are writable, which shell commands are
      allowed, which MCP servers are trusted) live in
      .chronos-code/security.yaml.

  - id: G-012
    title: Token efficiency — fewer tokens per task than competitors
    detail: |
      Chronos Code must consume significantly fewer tokens (40-60% less) than
      comparable coding agents (Claude Code, Cursor, Aider) for equivalent
      tasks. This is achieved through: tiered model routing (cheap models for
      mechanical tasks, expensive for reasoning), aggressive context
      compression, AST-aware partial file loading, tool result truncation,
      semantic deduplication, diff-based editing (never resend full files),
      plan-first execution (fewer retries), and real-time budget enforcement.
      Token efficiency is a first-class metric tracked in CI via eval suites.

  - id: G-013
    title: Session management
    detail: |
      Every interaction is a session with a unique ID, full message history,
      checkpoints, and metadata. Sessions are resumable (pick up where you
      left off), branchable (fork from a checkpoint), and inspectable (view
      history, traces, tool calls). Stored in the configured database.

non_goals:
  - "IDE extension / VS Code plugin — that's a separate product on top of the server API"
  - "Fine-tuning or model training — self-learning produces YAML, not model weights"
  - "Running untrusted code in production sandboxes — use Chronos sandbox directly for that"
  - "Replacing Chronos's CLI — chronos-code is a separate binary with a different audience"
  - "Supporting non-Go agent code — agents are YAML configs that drive Go runtime"
  - "Building a SaaS — this is an open-source tool, not a hosted service"

# ============================================================================
# 5. ARCHITECTURE
# ============================================================================

architecture:
  overview: |
    Chronos Code is a thin, opinionated layer on top of Chronos's SDK and
    engine. It provides: (1) a project-aware workspace layer, (2) YAML-driven
    agent/skill/guardrail configuration, (3) a TUI and server for user
    interaction, (4) a self-learning loop for continuous improvement.

    ┌─────────────────────────────────────────────────────┐
    │                   chronos-code CLI / Server          │
    │  ┌───────────┐ ┌──────────┐ ┌────────────────────┐  │
    │  │    TUI    │ │  Server  │ │   Self-Learning     │  │
    │  │  (REPL)   │ │ (HTTP)   │ │   Loop              │  │
    │  └─────┬─────┘ └────┬─────┘ └─────────┬──────────┘  │
