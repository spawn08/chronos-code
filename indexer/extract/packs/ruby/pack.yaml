# Ruby.
language: ruby
grammar: ruby
extensions: [.rb]
visibility:
  default: public
  keywords: {public: public, private: private, protected: protected}
  labels: [identifier]
modifiers:
  self: static
member_of: [class, module]
wrappers: [argument_list, call]
imports:
  binds: none
tests:
  files: ["*_test.rb", "*_spec.rb", "test_*.rb"]
  dirs: [test, spec]
  symbols: ["test_*"]
