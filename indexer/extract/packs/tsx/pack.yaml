# TypeScript with JSX: the typescript pack's query plus JSX patterns.
language: typescript
grammar: tsx
extensions: [.tsx]
query_from: typescript
visibility:
  default: private
  members: {"*": public, namespace: private, module: private}
  keywords: {public: public, private: private, protected: protected}
  private_prefix: "#"
  export_wrapper: export_statement
modifiers:
  static: static
  abstract: abstract
  async: async
  override: override
wrappers: [export_statement, lexical_declaration, variable_declaration, ambient_declaration, expression_statement]
imports:
  binds: none
tests:
  files: ["*.test.tsx", "*.spec.tsx"]
  dirs: [__tests__]
