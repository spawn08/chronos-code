<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="cc-logo-title">
  <title id="cc-logo-title">Chronos Code</title>
  <rect width="256" height="256" rx="56" fill="#2d3142"/>
  <!-- Chronos: an open clock ring that also reads as the letter C -->
  <path d="M 190.2 65.8 A 88 88 0 1 0 190.2 190.2" fill="none" stroke="#f5f5f5" stroke-width="18" stroke-linecap="round"/>
  <!-- Clock tick marking 12 o'clock -->
  <circle cx="128" cy="40" r="9" fill="#eb6c36"/>
  <!-- Code: a shell prompt -->
  <path d="M 96 100 L 134 128 L 96 156" fill="none" stroke="#eb6c36" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 148 160 H 176" fill="none" stroke="#f5f5f5" stroke-width="16" stroke-linecap="round"/>
</svg>
