# Chronos Code — Enterprise Authentication Configuration
# Supports: enterprise subscriptions, API keys, local models, SSO federation.

meta:
  version: "1.0.0"
  description: "Multi-provider enterprise authentication for chronos-code"

# Credential storage configuration
credential_store:
  # Where tokens and API keys are persisted between sessions
  backend: "keychain"  # keychain | encrypted_file | env_only

  keychain:
    description: "OS-native secure credential storage (recommended)"
    macos: "macOS Keychain (Security.framework)"
    linux: "libsecret (GNOME Keyring / KDE Wallet)"
    windows: "Windows Credential Manager"
    service_name: "chronos-code"

  encrypted_file:
    description: "Fallback when keychain is unavailable (headless servers, CI)"
    path: "~/.chronos-code/credentials.enc"
    algorithm: "AES-256-GCM"
    key_derivation: "Argon2id from user passphrase"
    notes: "User is prompted for passphrase on first use. Cached in memory for the session."

  env_only:
    description: "Never persist credentials. Read only from environment variables. For CI/CD."

  auto_refresh: true
  refresh_buffer_sec: 300  # refresh OAuth tokens 5 minutes before expiry

# Provider configurations
providers:

  # ── Anthropic / Claude ──────────────────────────────────────────────

  anthropic:
    display_name: "Anthropic (Claude)"
    methods: ["api_key", "setup_token"]
    # NOTE: Anthropic banned third-party OAuth relay in April 2026.
    # Third-party apps cannot use Claude subscription OAuth.
    # Use API key from console.anthropic.com or setup-token from `claude setup-token`.
    oauth_available: false
    env_vars:
      api_key: "ANTHROPIC_API_KEY"
      setup_token: "CLAUDE_SETUP_TOKEN"
    default_model: "claude-sonnet-4-6"
    models:
      T2_frontier: "claude-sonnet-4-6"
      T2_reasoning: "claude-opus-4-6"
      T1_cheap: "claude-haiku-4-5"
    login_flow:
      api_key: |
        1. Prompt user for API key (masked input)
        2. Validate with a test API call (models/list or a minimal chat)
        3. Store in credential store under "anthropic/api_key"
      setup_token: |
        1. Instruct user: run `claude setup-token` in another terminal
        2. Prompt for the generated token (masked input)
        3. Validate with a test call
        4. Store in credential store under "anthropic/setup_token"

  # ── Anthropic Claude Enterprise ────────────────────────────────────

  anthropic_enterprise:
    display_name: "Claude Enterprise"
    description: |
      Claude Enterprise is Anthropic's business/enterprise tier accessed
      via claude.ai/enterprise and the Anthropic API Console. It provides:
      - Organization-level admin controls and user management
      - SSO integration (SAML/OIDC) for console access
      - Admin-provisioned API keys with org-level billing
      - Data residency controls (US, EU regions)
      - Audit logs and usage tracking per user/team
      - Extended context windows and higher rate limits
      - No training on enterprise data

      Chronos-code treats Claude Enterprise as an Anthropic API connection
      with additional org-level metadata. The auth flow differs based on
      how the enterprise admin has provisioned access.

    methods: ["org_api_key", "admin_provisioned_key", "setup_token"]

    env_vars:
      api_key: "ANTHROPIC_API_KEY"
      org_id: "ANTHROPIC_ORG_ID"
      setup_token: "CLAUDE_SETUP_TOKEN"

    models:
      T2_frontier: "claude-sonnet-4-6"
      T2_reasoning: "claude-opus-4-6"
      T2_max: "claude-opus-4-6[1m]"           # 1M context — enterprise only
      T1_cheap: "claude-haiku-4-5"

    enterprise_features:
      extended_context: true                    # 1M token window available
      higher_rate_limits: true                  # enterprise tier has 4x default limits
      data_residency: true                      # EU/US region selection
      audit_logging: true                       # all API calls logged at org level
      sso_console: true                         # enterprise admins use SSO to manage keys

    login_flows:

      org_api_key:
        description: |
          The enterprise admin creates an org-level API key in the
          Anthropic Console (console.anthropic.com). This key is scoped
          to the organization — all usage is billed to the enterprise
          account, subject to org-level rate limits, and governed by
          the org's data residency settings.
        steps: |
          1. Enterprise admin creates API key at console.anthropic.com
             → Settings → API Keys → Create Key (scoped to org)
          2. Admin shares the key with the developer (secure channel)
          3. Developer runs: chronos-code login --provider anthropic-enterprise
          4. Prompt for API key (masked) + optional org_id
          5. Validate: POST /v1/messages with a minimal test
             - Verify org_id in response headers matches expected
          6. Store in credential store under "anthropic-enterprise/api_key"
          7. Print: "Logged in to Claude Enterprise (org: <org_name>)"

      admin_provisioned_key:
        description: |
          Some enterprise deployments use per-user API keys provisioned
          by the admin via the Anthropic Admin API or SCIM. Each developer
          gets their own key with individual usage tracking. The developer
          doesn't visit the console — the key is delivered via the org's
          internal tooling or SSO-gated provisioning portal.
        steps: |
          1. Developer receives API key from internal provisioning system
          2. Developer runs: chronos-code login --provider anthropic-enterprise
          3. Prompt for API key (masked)
          4. Validate with test call
          5. Store in credential store under "anthropic-enterprise/user_key"
          6. Usage is tracked per-user at the org level

      setup_token:
        description: |
          For developers who already have Claude Code installed with their
          enterprise account, they can generate a long-lived setup token
          that chronos-code can use. This is the simplest path for
          existing Claude Enterprise users.
        steps: |
          1. Developer runs `claude setup-token` in their terminal
             (uses their existing Claude Code enterprise login)
          2. Copy the generated token
          3. Run: chronos-code login --provider anthropic-enterprise --method setup-token
          4. Prompt for token (masked)
          5. Validate and store

    server_mode_integration:
      description: |
        In server mode, chronos-code can integrate with Claude Enterprise
        at the organization level. The server admin configures a single
        org-level API key, and individual users are identified by their
        SSO identity (mapped via the token exchange service). Usage is
        attributed per-user via the x-anthropic-metadata header.
      config: |
        providers:
          anthropic_enterprise:
            method: "org_api_key"
            api_key: "${ANTHROPIC_ENTERPRISE_KEY}"
            org_id: "${ANTHROPIC_ORG_ID}"
            headers:
              # Per-user attribution in multi-tenant server mode
              x-anthropic-metadata:
                user_id: "${AUTHENTICATED_USER_ID}"
            data_residency: "us"                # or "eu"
            rate_limit_tier: "enterprise"        # higher limits

    config_example: |
      # .chronos-code/config.yaml — Claude Enterprise setup
      model:
        provider: "anthropic"
        model: "claude-sonnet-4-6"
        api_key: "${ANTHROPIC_API_KEY}"
        # Enterprise-specific settings
        org_id: "${ANTHROPIC_ORG_ID}"
        # Optional: request 1M context window (enterprise feature)
        # model: "claude-opus-4-6[1m]"

      # Tiered routing with enterprise models
      routing:
        provider: "anthropic"
        tiers:
          T2: "claude-sonnet-4-6"
          T1: "claude-haiku-4-5"
        router_model: "claude-haiku-4-5"

  openai:
    display_name: "OpenAI"
    methods: ["api_key", "oauth"]
    oauth_available: true
    env_vars:
      api_key: "OPENAI_API_KEY"
      org_id: "OPENAI_ORG_ID"
    oauth_config:
      authorize_url: "https://auth.openai.com/authorize"
      token_url: "https://auth.openai.com/token"
      client_id: "chronos-code"
      scopes: ["openai.organization.read", "openai.models.read", "openai.chat.completions.create"]
      flow: "authorization_code_pkce"
      redirect_uri: "http://localhost:19284/callback"
    default_model: "gpt-4o"
    models:
      T2_frontier: "gpt-4o"
      T2_reasoning: "o3"
      T1_cheap: "gpt-4o-mini"
    login_flow:
      oauth: |
        1. Start local HTTP server on port 19284 for callback
        2. Open browser to authorize_url with PKCE challenge
        3. User logs in with enterprise SSO (Azure AD, Google, etc.)
        4. Receive auth code on callback
        5. Exchange for access + refresh tokens
        6. Store both in credential store under "openai/oauth"
        7. Print: "Logged in to OpenAI as <email> (org: <org_name>)"

  azure_openai:
    display_name: "Azure OpenAI"
    methods: ["api_key", "device_code", "managed_identity"]
    env_vars:
      api_key: "AZURE_OPENAI_API_KEY"
      endpoint: "AZURE_OPENAI_ENDPOINT"
      deployment: "AZURE_OPENAI_DEPLOYMENT"
      api_version: "AZURE_OPENAI_API_VERSION"
      tenant_id: "AZURE_TENANT_ID"
    oauth_config:
      authority: "https://login.microsoftonline.com/${AZURE_TENANT_ID}"
      scopes: ["https://cognitiveservices.azure.com/.default"]
      flow: "device_code"
    login_flow:
      device_code: |
        1. Request device code from Azure AD
        2. Print: "To sign in, visit https://microsoft.com/devicelogin and enter code: XXXX-YYYY"
        3. Poll for completion (15 second intervals, 5 minute timeout)
        4. Receive access + refresh tokens
        5. Store in credential store under "azure/oauth"
      managed_identity: |
        For server mode on Azure VMs/AKS/App Service:
        1. No credentials needed — uses the VM's managed identity
        2. Automatically acquires tokens from IMDS endpoint
        3. Set method: "managed_identity" in config

  google:
    display_name: "Google (Gemini)"
    methods: ["api_key", "oauth", "service_account"]
    oauth_available: true
    env_vars:
      api_key: "GEMINI_API_KEY"
      project_id: "GOOGLE_CLOUD_PROJECT"
      service_account_key: "GOOGLE_APPLICATION_CREDENTIALS"
    oauth_config:
      authorize_url: "https://accounts.google.com/o/oauth2/v2/auth"
      token_url: "https://oauth2.googleapis.com/token"
      client_id: "chronos-code.apps.googleusercontent.com"
      scopes: ["https://www.googleapis.com/auth/generative-language", "https://www.googleapis.com/auth/cloud-platform"]
      flow: "authorization_code_pkce"
      redirect_uri: "http://localhost:19284/callback"
    default_model: "gemini-2.0-flash"
    models:
      T2_frontier: "gemini-2.5-pro"
      T1_cheap: "gemini-2.0-flash"

  xai:
    display_name: "xAI (Grok)"
    methods: ["api_key"]
    env_vars:
      api_key: "XAI_API_KEY"
    default_model: "grok-3"
    models:
      T2_frontier: "grok-3"
      T1_cheap: "grok-3-mini"

  ollama:
    display_name: "Ollama (Local)"
    methods: ["none"]
    env_vars:
      base_url: "OLLAMA_HOST"
    default_base_url: "http://localhost:11434"
    default_model: "llama3.3"
    notes: |
      No authentication needed — Ollama runs locally. Ensure the Ollama
      daemon is running: `ollama serve`. Models are pulled on first use:
      `ollama pull llama3.3`.

  together:
    display_name: "Together AI"
    methods: ["api_key"]
    env_vars:
      api_key: "TOGETHER_API_KEY"
    base_url: "https://api.together.xyz/v1"
    protocol: "openai_compatible"

  groq:
    display_name: "Groq"
    methods: ["api_key"]
    env_vars:
      api_key: "GROQ_API_KEY"
    base_url: "https://api.groq.com/openai/v1"
    protocol: "openai_compatible"

  deepseek:
    display_name: "DeepSeek"
    methods: ["api_key"]
    env_vars:
      api_key: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com/v1"
    protocol: "openai_compatible"

  openrouter:
    display_name: "OpenRouter"
    methods: ["api_key"]
    env_vars:
      api_key: "OPENROUTER_API_KEY"
    base_url: "https://openrouter.ai/api/v1"
    protocol: "openai_compatible"
    notes: "Proxy supporting 100+ models. Useful for model experimentation."

# CLI commands
cli:
  login:
    usage: "chronos-code login [--provider <name>] [--method <method>]"
    description: "Authenticate with a model provider"
    examples:
      - "chronos-code login                          # auto-detect from config"
      - "chronos-code login --provider openai         # OAuth flow for OpenAI"
      - "chronos-code login --provider anthropic      # prompt for API key"
      - "chronos-code login --provider azure --method device_code"
      - "chronos-code login --provider ollama         # verify local connection"

  logout:
    usage: "chronos-code logout [--provider <name>]"
    description: "Clear stored credentials"

  auth_status:
    usage: "chronos-code auth status"
    description: "Show authentication state for all configured providers"
    output_format: |
      Provider       Method       Status    Identity            Expires
      anthropic      api_key      active    org-abc123          never
      openai         oauth        active    user@corp.com       2h 45m
      azure          device_code  expired   user@corp.com       -
      ollama         none         active    localhost:11434     never

  auth_refresh:
    usage: "chronos-code auth refresh [--provider <name>]"
    description: "Force refresh OAuth tokens before expiry"

# Model routing — which model for which tier
model_routing:
  description: |
    Chronos-code uses tiered model routing to minimize costs. The router
    selects T0 (no LLM), T1 (cheap), or T2 (frontier) per task.
    Configure the model for each tier per provider.
  config_example:
    routing:
      provider: "anthropic"
      tiers:
        T2: "claude-sonnet-4-6"
        T1: "claude-haiku-4-5"
      router_model: "claude-haiku-4-5"
      router_budget_tokens: 500

# Server mode SSO
server_sso:
  description: "OIDC/SAML federation for multi-tenant server deployments"
  config:
    auth:
      type: "oidc"
      issuer: "https://login.corp.com"
      client_id: "chronos-code-server"
      client_secret: "${OIDC_CLIENT_SECRET}"
      scopes: ["openid", "profile", "email"]
      token_exchange:
        enabled: true
        endpoint: "https://internal-api.corp.com/token-exchange"
        description: |
          Maps authenticated user identity to provider API credentials.
          The exchange service is managed by the org admin and returns
          provider-specific tokens based on user/group membership.
