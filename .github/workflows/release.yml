name: Release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'release/**'
      - 'go.mod'
      - 'go.sum'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chronos-code
        uses: actions/checkout@v4
        with:
          path: chronos-code
      - name: Read pinned Chronos revision
        id: chronos
        shell: bash
        run: |
          revision="$(tr -d '[:space:]' < chronos-code/release/chronos.version)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release blocked: release/chronos.version does not contain a published compatible commit" >&2
            exit 1
          fi
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Chronos
        uses: actions/checkout@v4
        with:
          repository: spawn08/chronos
          ref: ${{ steps.chronos.outputs.revision }}
          path: chronos
      - uses: actions/setup-go@v5
        with:
          go-version-file: chronos-code/go.mod
          cache-dependency-path: chronos-code/go.sum
      - name: Verify pinned workspace
        run: |
          test "$(git -C chronos rev-parse HEAD)" = "${{ steps.chronos.outputs.revision }}"
          go work init ./chronos-code ./chronos
      - name: Test
        working-directory: chronos-code
        run: make test

  build:
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
    steps:
      - name: Checkout chronos-code
        uses: actions/checkout@v4
        with:
          path: chronos-code
          fetch-depth: 0
      - name: Read pinned Chronos revision
        id: chronos
        shell: bash
        run: |
          revision="$(tr -d '[:space:]' < chronos-code/release/chronos.version)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Chronos
        uses: actions/checkout@v4
        with:
          repository: spawn08/chronos
          ref: ${{ steps.chronos.outputs.revision }}
          path: chronos
      - uses: actions/setup-go@v5
        with:
          go-version-file: chronos-code/go.mod
          cache-dependency-path: chronos-code/go.sum
      - name: Verify pinned workspace
        run: |
          test "$(git -C chronos rev-parse HEAD)" = "${{ steps.chronos.outputs.revision }}"
          go work init ./chronos-code ./chronos
      - name: Build binary
        working-directory: chronos-code
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME:-pr}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          MODULE="github.com/spawn08/chronos-code"
          LDFLAGS="-s -w -X '${MODULE}/internal/cli.Version=${VERSION}' -X '${MODULE}/internal/cli.Commit=${COMMIT}' -X '${MODULE}/internal/cli.BuildDate=${BUILD_DATE}'"
          BINARY="chronos-code"
          if [ "${{ matrix.goos }}" = "windows" ]; then BINARY="${BINARY}.exe"; fi
          go build -ldflags "${LDFLAGS}" -trimpath -buildvcs=true -o "${BINARY}" ./cmd/chronos-code
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          file: chronos-code/chronos-code${{ matrix.goos == 'windows' && '.exe' || '' }}
          format: spdx-json
          output-file: chronos-code/chronos-code-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json
      - name: Package
        working-directory: chronos-code
        run: |
          ARCHIVE_NAME="chronos-code-${GITHUB_REF_NAME:-pr}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${ARCHIVE_NAME}.zip" chronos-code.exe README.md
            echo "ASSET=${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"
          else
            tar czf "${ARCHIVE_NAME}.tar.gz" chronos-code README.md
            echo "ASSET=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chronos-code-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            chronos-code/${{ env.ASSET }}
            chronos-code/chronos-code-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json
          if-no-files-found: error

  integrity:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate and verify checksums
        working-directory: artifacts
        run: |
          sha256sum chronos-code-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/chronos-code-*
      - uses: sigstore/cosign-installer@v3.7.0
        if: github.event_name != 'pull_request'
      - name: Keyless sign and verify checksums
        if: github.event_name != 'pull_request'
        working-directory: artifacts
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp '^https://github.com/spawn08/chronos-code/.github/workflows/release.yml@refs/(tags|heads)/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-integrity
          path: artifacts/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [integrity]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-integrity
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
