name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chronos-code
        uses: actions/checkout@v4
        with:
          path: chronos-code

      - name: Checkout chronos (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: spawn08/chronos
          path: chronos
          token: ${{ secrets.CHRONOS_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: chronos-code/go.sum

      - name: Vet
        working-directory: chronos-code
        run: go vet ./...

      - name: Check formatting
        working-directory: chronos-code
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chronos-code
        uses: actions/checkout@v4
        with:
          path: chronos-code

      - name: Checkout chronos (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: spawn08/chronos
          path: chronos
          token: ${{ secrets.CHRONOS_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: chronos-code/go.sum

      - name: Test
        working-directory: chronos-code
        run: make test

  eval:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout chronos-code
        uses: actions/checkout@v4
        with:
          path: chronos-code

      - name: Checkout chronos (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: spawn08/chronos
          path: chronos
          token: ${{ secrets.CHRONOS_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: chronos-code/go.sum

      - name: Build and run eval
        working-directory: chronos-code
        run: make eval

      - name: Upload eval dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: chronos-code/benchmark/eval/report.md
