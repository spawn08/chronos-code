# Chronos Code — Agent Routing Configuration
# Classifies intent so Chronos Code can pick a model and suggest a specialist.
# The conversation stays on the primary agent unless
# the user @mentions / /agent switches, or explicitly configured durable-planning
# enabled-mode delegates.

meta:
  version: "1.0.0"
  description: "Intent classification and model routing for the Chronos Code primary agent"

# Router configuration
router:
  description: |
    The router runs on every user message. It classifies intent for model
    selection and an advisory specialist hint. It does not replace Chronos
    Code as the conversation partner. The optional fallback classifier uses
    the configured model with a tight token budget.
  model:
    provider: "anthropic"
    model: "claude-haiku-4-5"
  budget_tokens: 500
  classification_prompt: |
    Classify this user message into ONE intent. Reply with only the intent name.
    Intents: explain, review, debug, plan, search, architecture, code (default).

    Rules:
    - "explain" = user wants something explained, not changed
    - "review" = user wants existing code reviewed/audited
    - "debug" = user mentions an error, failure, crash, or test failing
    - "plan" = user wants to decompose or plan before implementing
    - "search" = user wants to find something (file, function, pattern)
    - "architecture" = user asks about design, structure, patterns
    - "code" = everything else (implement, fix, refactor, add, change, write)

# Advisory starting paths. max_tool_calls is an effort estimate, not an enforced
# execution limit. Reassess scope using evidence and complete necessary checks.
implementation_paths:
  low:
    max_tool_calls: 4
    graph: "L2"
    plan: "skip"
    hint: "start with targeted graph/source lookup; work directly when straightforward; expand investigation if needed; complete the requested outcome and verify changes"
  medium:
    max_tool_calls: 12
    graph: "L0-L2"
    plan: "working-plan"
    hint: "reuse relevant findings; inspect affected code paths; maintain a concise working plan when useful; implement and integrate; use impact_analysis/test_map to help select checks, then run sufficient verification for the actual risk"
  high:
    max_tool_calls: 24
    graph: "L0-L3"
    plan: "durable-or-working-plan"
    hint: "map dependencies and acceptance criteria; ask delivery-strategist for a bounded evidence-driven frontier when durable planning is useful; shadow mode does not execute that frontier, so otherwise maintain a working plan and verify every deliverable"

# Task complexity and kind to model mapping. Undeclared cells fall back to
# medium/edit so model selection is deterministic for every classification.
model_routing:
  # Roles configured for Sonnet-class work retain at least the medium route.
  # Researcher and explainer intentionally retain low-complexity Haiku routes.
  role_floors:
    chronos-code: medium
    coder: medium
    planner: medium
    delivery-strategist: medium
    reviewer: medium
    debugger: medium
    architect: medium
    tester: medium
  models:
    low:
      edit:
        provider: "anthropic"
        model: "claude-haiku-4-5"
      explain:
        provider: "anthropic"
        model: "claude-haiku-4-5"
    medium:
      edit:
        provider: "anthropic"
        model: "claude-sonnet-5"
    high:
      refactor:
        provider: "anthropic"
        model: "claude-sonnet-5"
      debug:
        provider: "anthropic"
        model: "claude-opus-4-8"
      architect:
        provider: "anthropic"
        model: "claude-opus-4-8"

# The legacy-named ppd section defaults to observation only. Enabled mode
# delegates one turn to the read-only strategist; no production rolling
# replanning loop currently consumes successive frontiers.
# Set mode to "enabled" for explicit planning trials or "disabled" to skip it.
ppd:
  version: "v1"
  mode: "shadow"
  specialist: "delivery-strategist"
  max_planner_calls: 1
  thresholds:
    min_files: 3
    min_packages: 2
    min_estimated_calls: 5

# Intent → Agent mapping
intent_routing:

  - intent: "explain"
    agent: "explainer"
    tier: "T1"
    patterns:
      - "explain"
      - "what does"
      - "how does"
      - "why does"
      - "walk me through"
      - "what is"
      - "how is.*used"
      - "describe"
      - "tell me about"
    reason: "Explanation is delegated to the read-only explainer"

  - intent: "review"
    agent: "reviewer"
    tier: "T2"
    patterns:
      - "review"
      - "check (my|the|this)"
      - "audit"
      - "look at (my|the|this) (changes|diff|code|PR)"
      - "any (bugs|issues|problems)"
      - "code quality"
      - "security (check|audit|review)"
    reason: "Review needs nuanced judgment and security awareness"

  - intent: "debug"
    agent: "debugger"
    tier: "T2"
    patterns:
      - "debug"
      - "fix (the|this) (error|failure|crash|bug|issue)"
      - "why is.*failing"
      - "test.*fail"
      - "broken"
      - "doesn't work"
      - "stack trace"
      - "panic"
      - "segfault"
      - "nil pointer"
    reason: "Diagnosis needs deep reasoning and error trace analysis"

  - intent: "plan"
    agent: "planner"
    tier: "T2"
    patterns:
      - "plan"
      - "break down"
      - "decompose"
      - "how should I approach"
      - "what steps"
      - "strategy for"
      - "design a solution"
      - "roadmap"
    reason: "Planning needs strong reasoning to decompose correctly"

  - intent: "search"
    agent: "researcher"
    tier: "T1"
    patterns:
      - "find"
      - "where is"
      - "which file"
      - "search"
      - "locate"
      - "grep"
      - "show me"
      - "list all"
      - "who (calls|uses|implements)"
    reason: "Search is delegated to the read-only researcher"

  - intent: "architecture"
    agent: "architect"
    tier: "T2"
    patterns:
      - "design"
      - "architecture"
      - "structure"
      - "should I use.*pattern"
      - "dependency"
      - "package (layout|structure|organization)"
      - "interface design"
      - "abstraction"
    reason: "Design needs broad knowledge and careful judgment"

  - intent: "code"
    agent: "chronos-code"
    tier: "T2"
    patterns:
      - "default — all other requests"
    reason: "General coding tasks stay with Chronos Code, which may spawn coder"

# Explicit agent switch
explicit_switch:
  syntax: "@<agent_id> <message>"
  description: |
    Users can bypass the router and address a specific agent directly.
    The @ prefix routes to the named agent regardless of intent classification.
  examples:
    - "@chronos-code implement the rest after the plan"
    - "@reviewer check my last commit for security issues"
    - "@planner break down this feature into tasks"
    - "@debugger why is TestBuildAgent failing with nil pointer"
    - "@explainer how does the middleware chain work in this project"
    - "@researcher find all files that import the storage package"
    - "@architect should we use the repository pattern here"
    - "@coder add error handling to the HTTP handler"
    - "@tester run the focused parser tests and report the results"
