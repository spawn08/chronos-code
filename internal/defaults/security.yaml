version: "v1"

filesystem:
  writable_paths: ["."]
  readable_paths: [".", "~/.chronos-code/"]
  denied_paths:
    - ".env"
    - ".env.*"
    - ".git/config"
    - "**/*.pem"
    - "**/*.key"
    - "**/credentials*"
    - "**/secrets/**"

shell:
  allowed_commands:
    - "go"
    - "git"
    - "make"
    - "npm"
    - "node"
    - "python"
    - "pip"
    - "cargo"
    - "rustc"
    - "ls"
    - "cat"
    - "grep"
    - "rg"
    - "find"
    - "wc"
    - "diff"
    - "jq"
  denied_patterns:
    - "rm -rf /"
    - "sudo"
    - "curl | sh"
    - "wget | sh"
  auto_allow:
    - '^go test(\s|$)'
  confirm:
    - '^git\s+push(\s|$)'
  never_allow:
    - '(^|\s)sudo(\s|$)'
    - 'rm\s+-rf\s+/(\s|$)'
    # file_read (with start_line/end_line) and file_grep (with regex and
    # recursive directory search) fully replace these two shapes now — every
    # agent's system prompt already says so, but agents keep reaching for
    # shell anyway (habit beats a soft instruction), which burns the
    # cumulative token budget on redundant round trips. Hard-block them here
    # instead of just asking nicely. Anchored at the start of the command so
    # legitimate pipeline uses (`go test 2>&1 | grep -n FAIL`) still work.
    - '^sed\s+-n\s'
    - '^grep\s+-[a-zA-Z]*r?n[a-zA-Z]*(\s|$)'
  max_execution_time_sec: 300

secrets:
  scan_output: true
  patterns:
    - "AKIA[0-9A-Z]{16}"
    - "ghp_[a-zA-Z0-9]{36}"
    - "sk-[a-zA-Z0-9]{48}"
    - "-----BEGIN.*PRIVATE KEY-----"
