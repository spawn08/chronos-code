workspace:
  index_on_start: true
  graph_db: ".chronos-code/graph.db"

tools:
  compression_threshold_tokens: 500

memory:
  enabled: true
  backend: "yaml"
  auto_extract: true

router:
  enabled: true

learning:
  enabled: true
  auto_distill: false
  min_sessions_before_distill: 3
  review_before_apply: true
  output_dir: ".chronos-code/learned"

session:
  auto_resume: false
  max_history_turns: 0

# Each zero limit independently disables that constraint. Periodic cleanup is
# opt-in; explicit cleanup commands use these conservative defaults.
retention:
  enabled: true
  batch_size: 100
  periodic_interval_minutes: 0
  policies:
    sessions: {max_age_days: 90, max_count: 500, max_bytes: 0}
    events: {max_age_days: 90, max_count: 50000, max_bytes: 536870912}
    traces: {max_age_days: 30, max_count: 20000, max_bytes: 268435456}
    audit: {max_age_days: 365, max_count: 100000, max_bytes: 536870912}
    checkpoints: {max_age_days: 30, max_count: 10000, max_bytes: 268435456}
    session_files: {max_age_days: 30, max_count: 10000, max_bytes: 536870912}
    telemetry: {max_age_days: 90, max_count: 10000, max_bytes: 268435456}
    layered_memory: {max_age_days: 365, max_count: 50000, max_bytes: 268435456}
    edit_checkpoints: {max_age_days: 30, max_count: 1000, max_bytes: 1073741824}
    input_artifacts: {max_age_days: 7, max_count: 500, max_bytes: 268435456}
    worktrees: {max_age_days: 1, max_count: 100, max_bytes: 0}
    tui_logs: {max_age_days: 14, max_count: 20, max_bytes: 67108864}
    limiter_entries: {max_age_days: 1, max_count: 10000, max_bytes: 16777216}

# Applies report/enforce policy to runtime-derived obligations and explicitly
# trusted adapter fixtures.
verification:
  mode: "report"

repair:
  max_attempts: 1
  max_model_calls: 12
  max_tool_calls: 100
  wall_time_sec: 1800
  max_tokens: 500000
  # Provider model-list APIs do not expose authoritative pricing, and Azure
  # deployment aliases cannot be safely mapped to a billed model. Keep USD
  # enforcement opt-in; the other cumulative repair limits remain active.
  max_cost_microdollars: 0

# Durable evidence ledger for long-horizon tasks. When enabled, executions
# with an explicit task ID (plan nodes, resumed tasks) keep verification
# evidence across turns and restarts under <project>/ledgers/. Files changed
# outside the agent between executions invalidate overlapping evidence.
ledger:
  persist: false

# Self-invalidating working memory: ranged file reads are recorded as claims
# anchored to content hashes. Writes, mutating shell commands, and task
# continuation re-check them; outdated reads are flagged to the model and
# every status change is appended to the evidence ledger.
claims:
  enabled: false

defaults:
  model:
    provider: "anthropic"
    model: "claude-sonnet-4-6"
  storage:
    backend: "sqlite"
    dsn: ".chronos-code/sessions.db"
  stream: true
  permission_mode: "prompt"
  reasoning:
    strategy: "cot"
    native: false
    effort: "medium"
    summary: false
  context:
    max_tokens: 128000
    summarize_threshold: 0.8
    preserve_recent_turns: 6

agents:
  - id: chronos-code
    name: Chronos Code
    model:
      provider: "anthropic"
      model: "claude-sonnet-4-6"
    tools:
      - name: file_read
        permission: allow
      - name: file_write
        permission: require_approval
      - name: file_list
        permission: allow
      - name: file_glob
        permission: allow
      - name: file_grep
        permission: allow
      - name: shell
        permission: require_approval
    sub_agents:
      - coder
      - planner
      - delivery-strategist
      - reviewer
      - debugger
      - researcher
      - architect
      - explainer
      - tester

  - id: coder
