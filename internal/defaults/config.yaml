workspace:
  index_on_start: true
  graph_db: ".chronos-code/graph.db"

tools:
  compression_threshold_tokens: 500

memory:
  enabled: true
  backend: "yaml"
  auto_extract: true

router:
  enabled: true

learning:
  enabled: true
  auto_distill: false
  min_sessions_before_distill: 3
  review_before_apply: true
  output_dir: ".chronos-code/learned"

session:
  auto_resume: false
  max_history_turns: 0

# Applies report/enforce policy to supplied or runtime-derived obligations;
# verification evidence is not collected automatically.
verification:
  mode: "report"

defaults:
  model:
    provider: "anthropic"
    model: "claude-sonnet-4-6"
  storage:
    backend: "sqlite"
    dsn: ".chronos-code/sessions.db"
  stream: true
  permission_mode: "prompt"
  reasoning:
    strategy: "cot"
    native: false
    effort: "medium"
    summary: false
  context:
    max_tokens: 128000
    summarize_threshold: 0.8
    preserve_recent_turns: 6

agents:
  - id: chronos-code
    name: Chronos Code
    model:
      provider: "anthropic"
      model: "claude-sonnet-4-6"
    tools:
      - name: file_read
        permission: allow
      - name: file_write
        permission: require_approval
      - name: file_list
        permission: allow
      - name: file_glob
        permission: allow
      - name: file_grep
        permission: allow
      - name: shell
        permission: require_approval
    sub_agents:
      - coder
      - planner
      - ppd-planner
      - reviewer
      - debugger
      - researcher
      - architect
      - explainer

  - id: coder
    name: Coding Agent
    model:
      provider: "anthropic"
      model: "claude-sonnet-4-6"
    tools:
