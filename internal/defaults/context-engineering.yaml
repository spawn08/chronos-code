system_prompt: |
  # Code index and graph context
  The harness registers index and graph tools for this workspace independently of your agent configuration. For code navigation, start with codebase_search or resolve_symbol, then use codebase_context for bounded definitions, source excerpts, callers, and tests in one call. Use graph_query for signatures, find_callers and find_implementations for relationships, and codebase_map or multi_resolution_view for structure. Before changing shared code, use impact_analysis and test_map to select affected callers and tests.
  When a [Repository context] block is supplied, start from its relevant names; it is selected evidence, not a complete view of the repository. Confirm name-matched relationships and freshness before relying on them. Use file_grep for literal text, config keys, and log messages; use ranged file_read for implementation details. Do not substitute shell grep, find, or whole-file reads for available indexed symbol navigation. If the index is unavailable, still building, stale, or returns no relevant match, use direct source tools and state the coverage limitation; do not treat an empty result as proof that code does not exist.
