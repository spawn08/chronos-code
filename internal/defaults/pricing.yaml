# Model pricing used for session cost reporting and USD budget enforcement.
#
# All rates are USD per 1,000,000 tokens. input and output are required.
# Omitted cache_read and cache_write default to the input rate (no discount
# or premium assumed); omitted cache_write_1h defaults to cache_write.
# cache_write is Anthropic's default 5-minute TTL rate; cache_write_1h is its
# 1-hour TTL rate (2x base input per Anthropic's published cache multipliers).
#
# tiers replace the base rates for the whole call once its prompt (uncached
# input + cache reads + cache writes) exceeds `above` tokens. List them in
# ascending order of `above`.
#
# Rates are a snapshot of https://models.dev/api.json taken 2026-09-25
# (cache_write_1h excepted: models.dev does not publish it). Provider prices
# change: override or add entries in ~/.chronos-code/pricing.yaml (user) or
# <project>/.chronos-code/pricing.yaml (project). Overlay entries replace the
# bundled entry for the same model ID; everything else is kept.
#
# Lookups are case-insensitive and tolerate provider prefixes
# ("anthropic/claude-sonnet-4-5"), Bedrock/Vertex forms
# ("us.anthropic.claude-sonnet-4-5-20250929-v1:0", "claude-sonnet-4-5@20250929"),
# trailing release dates, and dotted versions ("claude-sonnet-4.5").
# Models without an entry are reported as unpriced, never as $0.
models:
  # Anthropic
  claude-fable-5-1:  { input: 10, output: 50, cache_read: 0.25, cache_write: 12.5, cache_write_1h: 20 }
  claude-fable-5:    { input: 10, output: 50, cache_read: 1,    cache_write: 12.5, cache_write_1h: 20 }
  claude-opus-5-5:   { input: 4,  output: 20, cache_read: 0.2,  cache_write: 5,    cache_write_1h: 8 }
  claude-opus-5:     { input: 5,  output: 25, cache_read: 0.5,  cache_write: 6.25, cache_write_1h: 10 }
  claude-opus-4-8:   { input: 5,  output: 25, cache_read: 0.5,  cache_write: 6.25, cache_write_1h: 10 }
  claude-opus-4-7:   { input: 5,  output: 25, cache_read: 0.5,  cache_write: 6.25, cache_write_1h: 10 }
  claude-opus-4-6:   { input: 5,  output: 25, cache_read: 0.5,  cache_write: 6.25, cache_write_1h: 10 }
  claude-opus-4-5:   { input: 5,  output: 25, cache_read: 0.5,  cache_write: 6.25, cache_write_1h: 10 }
  claude-sonnet-5:   { input: 2,  output: 10, cache_read: 0.2,  cache_write: 2.5,  cache_write_1h: 4 }
  claude-sonnet-4-6: { input: 3,  output: 15, cache_read: 0.3,  cache_write: 3.75, cache_write_1h: 6 }
  claude-sonnet-4-5: { input: 3,  output: 15, cache_read: 0.3,  cache_write: 3.75, cache_write_1h: 6 }
  claude-haiku-4-5:  { input: 1,  output: 5,  cache_read: 0.1,  cache_write: 1.25, cache_write_1h: 2 }

  # OpenAI (cached input is reported inside prompt tokens; no write surcharge)
  gpt-5.5:
    input: 5
    output: 30
    cache_read: 0.5
    tiers:
      - { above: 272000, input: 10, output: 45, cache_read: 1 }
  gpt-5:       { input: 1.25, output: 10,  cache_read: 0.125 }
  gpt-5-mini:  { input: 0.25, output: 2,   cache_read: 0.025 }
  gpt-5-nano:  { input: 0.05, output: 0.4, cache_read: 0.005 }
  gpt-4o:      { input: 2.5,  output: 10,  cache_read: 1.25 }
  gpt-4o-mini: { input: 0.15, output: 0.6, cache_read: 0.075 }
  o3:          { input: 2,    output: 8,   cache_read: 0.5 }
  o3-mini:     { input: 1.1,  output: 4.4, cache_read: 0.55 }
  o1:          { input: 15,   output: 60,  cache_read: 7.5 }

  # Google
  gemini-2.5-pro:
    input: 1.25
    output: 10
    cache_read: 0.125
    tiers:
      - { above: 200000, input: 2.5, output: 15, cache_read: 0.25 }
  gemini-2.5-flash: { input: 0.3, output: 2.5, cache_read: 0.03 }

  # Others
  mistral-large-latest:    { input: 0.5,  output: 1.5 }
  llama-3.3-70b-versatile: { input: 0.59, output: 0.79 }
