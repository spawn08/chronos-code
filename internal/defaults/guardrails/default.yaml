name: default
description: Standard guardrails for coding agents

input:
  # Headless callers send task prompts of several hundred KB; the context
  # window guard still rejects input the model cannot hold.
  - type: max_length
    max_chars: 1000000

output:
  - type: max_length
    max_chars: 200000

cost:
  max_tokens_per_session: 500000
  warn_at_percent: 80
