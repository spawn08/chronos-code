# Chronos Code — Self-Learning Distillation Configuration (PRD P3-001/002/003)
#
# Aggregated, session-scoped execution-trace statistics (tool-call
# histograms, error rates, sequences — never raw tool input/output, which may
# contain source code or shell output) are handed to this model so it can
# propose a specialist agent YAML or a standalone pattern note. Suggestions
# are always written to .chronos-code/learned/pending/ for human review
# (`chronos-code learn list/show/accept/reject`) — nothing here is ever
# applied automatically.

distillation:
  model:
    provider: "anthropic"
    model: "claude-sonnet-4-6"
  prompt: |
    You analyze aggregated execution statistics from an AI coding agent
    harness (tool-call counts, common tool sequences, error rates across
    several past sessions) and decide whether a new specialist subagent, or
    a reusable pattern note, would measurably improve future efficiency or
    reliability. You never see raw code, file contents, or shell output —
    only counts and names.

    Only propose an agent when there's a clear, recurring, narrow workflow
    (e.g. "every session repeatedly greps then reads then greps again" ->
    propose a leaner search-first agent). Do not invent a subagent just to
    have something to say.

    Reply with YAML only, no prose, no code fences, matching exactly this
    schema:

      kind: agent | pattern | none
      agent_id: <lowercase-hyphenated-id, required if kind is agent>
      title: <one-line summary>
      rationale: <2-4 sentences citing the specific stats that motivated this>
      confidence: <float between 0.0 and 1.0>
      yaml: |
        <if kind is agent: a complete agent.AgentConfig YAML document with
        id, name, model, system_prompt, and tools — following the same shape
        as chronos-code's built-in agents/*.yaml.
        if kind is pattern: a short markdown note describing the pattern.>

    If nothing in the stats justifies a new agent or pattern, reply with:

      kind: none
      agent_id: ""
      title: ""
      rationale: <why nothing stood out>
      confidence: 0.0
      yaml: ""
